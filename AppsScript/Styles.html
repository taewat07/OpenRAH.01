    .content { width: min(1120px, calc(100% - 56px)); padding-top: 34px; }
    .hero {
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
      padding: 38px 0 32px;
      border-top: var(--section-divider);
      border-bottom: var(--section-divider);
      background: transparent;
    }
    .hero h1 {
      max-width: 920px;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(2.35rem, 4.7vw, 4.7rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: .025em;
    }
    .hero h1 span {
      display: inline;
      margin: 0 .08em;
      padding: 0 .08em;
      background: var(--lime);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .hero p { color: var(--ink-soft); font-size: .92rem; }
    .progress-orbit { width: 150px; border-left-color: var(--ink); background: linear-gradient(to right, var(--ink) var(--progress), var(--line) 0) left bottom / 100% 4px no-repeat; }
    .progress-number strong { color: var(--ink); font-family: var(--font-display); }
    .progress-number small { color: var(--ink-soft); }

    .form-section {
      margin-top: 36px;
      border-bottom: 0;
      overflow: visible;
    }
    .section-heading {
      padding: 24px;
      border: var(--section-heading-border);
      border-radius: 12px;
    }
    .section-body {
      padding: 24px 4px 38px;
      border-bottom: var(--section-divider);
    }
    .section-kicker {
      display: inline-flex;
      padding: 4px 8px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(252, 250, 245, .72);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: .6rem;
      letter-spacing: .08em;
    }
    .section-heading h2 { color: var(--ink); font-size: clamp(1.25rem, 2vw, 1.7rem); }
    .section-tag { border-color: var(--ink); border-radius: 999px; color: var(--ink); background: rgba(252, 250, 245, .82); }

    .field label, .mini-field label, .step-card .mini-field label { color: var(--ink); font-size: .7rem; font-weight: 800; }
    input, textarea { border-color: var(--line-strong); border-radius: 6px; color: var(--ink); background: var(--surface-strong); }
    input:focus, textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(255, 233, 92, .72); }
    input[readonly] { background: var(--paper-deep); }

    .checklist, .step-list { border-top: var(--section-divider); }
    .check-row, .step-card { border-bottom: var(--section-divider); }
    .segmented { border-color: var(--ink); border-radius: 7px; background: var(--surface); }
    .segment { border-radius: 4px; color: var(--ink-soft); }
    .segment:hover { color: var(--ink); background: var(--lime-soft); }
    .segment.selected.yes { color: var(--ink); background: var(--mint); }
    .segment.selected.no { color: var(--ink); background: var(--coral-soft); }
    .segment.selected.na { color: var(--ink); background: #a8e5e5; }

    .step-number, .category-number { border: 1px solid var(--ink); color: var(--ink); background: var(--lime); }
    .icon-button { border-color: var(--ink); border-radius: 6px; color: var(--coral-dark); background: transparent; }
    .icon-button:hover { color: var(--ink); background: var(--coral-soft); }
    .add-row { border-color: var(--ink); background: var(--mint); }
    .add-row:hover { background: var(--lime); }

    .legend-dot.low { background: var(--ink); }
    .legend-dot.medium { background: var(--amber); }
    .legend-dot.high { background: var(--coral); }
    .category-list { border-top: var(--section-divider); }
    .category { border-bottom: var(--section-divider); }
    .category[open] summary { border-bottom: var(--section-divider); background: var(--lime-soft); }
    .category-status { border-color: var(--ink); color: var(--ink); background: var(--surface); }
    .category-status.complete { background: var(--mint); }
    .category-status.has-risk { border-color: var(--coral); color: var(--ink); background: var(--coral); }
    .category-tools, .hazard-row { border-bottom: var(--section-divider); }
    .category-tools { background: var(--surface); }
    .risk-choice { border-color: var(--ink); border-radius: 6px; color: var(--ink); background: transparent; }
    .risk-choice:hover { background: var(--lime-soft); }
    .risk-choice.selected.present { border-color: var(--ink); color: var(--ink); background: var(--lime); }
    .risk-choice.selected.absent { border-color: var(--ink); color: var(--ink); background: var(--mint); }
    .score-option { border-color: var(--ink); border-radius: 6px; }
    .score-option[data-value] { color: var(--ink-soft); background: transparent; }
    .score-option[data-value]:hover { color: var(--ink); background: var(--paper-deep); }
    .score-option[data-value="1"].selected { border-color: var(--green); color: var(--ink); background: var(--green); }
    .score-option[data-value="2"].selected { border-color: var(--amber); color: var(--ink); background: var(--amber-soft); }
    .score-option[data-value="3"].selected { border-color: var(--coral); color: var(--ink); background: var(--coral); }
    .score-display { border-style: solid; border-color: var(--line-strong); background: var(--paper); }
    .score-display.low { border-color: var(--green); color: var(--ink); background: var(--green-soft); }
    .score-display.medium { border-color: var(--amber); color: var(--ink); background: var(--amber-soft); }
    .score-display.high { border-color: var(--coral); color: var(--ink); background: var(--coral-soft); }
    .score-display.low,
    .score-display.medium,
    .score-display.high { color: var(--ink); }
    .score-display .risk-badge {
      min-width: 0;
      padding: 0;
      border-radius: 0;
      color: inherit;
      background: transparent;
      font-size: .72rem;
    }
    .risk-badge { color: var(--ink); background: var(--lime); }
    .sticky-submit { left: 228px; border-top-color: var(--ink); background: rgba(252, 250, 245, .96); }
    .toast { border-color: var(--ink); border-radius: 8px; color: var(--ink); background: var(--lime); }

    .section-heading {
      position: relative;
      min-height: 112px;
      isolation: isolate;
      overflow: hidden;
    }

    .section-heading > * { position: relative; z-index: 1; }

    .section-heading::after {
      position: absolute;
      top: 7px;
      right: 138px;
      z-index: 0;
      width: 220px;
      height: 122px;
      opacity: .82;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      content: "";
      pointer-events: none;
    }

    #summary-section .section-heading { background: #f7d7c4; }

    @media (min-width: 761px) {
      .section-heading::after {
        top: 50%;
        transform: translateY(-50%);
      }

      #checklist-section .section-heading::after,
      #hazards-section .section-heading::after {
        width: 286px;
        height: 159px;
      }

      #checklist-section .section-heading::after {
        transform: translateY(-50%) rotate(2deg);
      }

      #steps-section .section-heading::after {
        width: 330px;
        height: 183px;
        transform: translateY(-50%) rotate(-2deg);
      }

      #hazards-section .section-heading::after {
        transform: translateY(-50%) rotate(1deg);
      }

      #summary-section .section-heading::after {
        transform: translateY(-50%) rotate(-1deg);
      }
    }

    @media (max-width: 1040px) {
      .app-shell { grid-template-columns: 72px minmax(0, 1fr); }
      .sticky-submit { left: 72px; }
    }

    @media (max-width: 760px) {
      .content { width: calc(100% - 28px); }
      .hero { grid-template-columns: 1fr; padding: 28px 0 24px; }
      .hero h1 { font-size: clamp(2.15rem, 11vw, 3.3rem); }
      .progress-orbit { width: 100%; border-left: 0; }
      .menu-toggle, .drawer-close { border-color: var(--ink); background: var(--lime); }
      .rail { background: var(--paper); }
      .form-section { margin-top: 28px; }
      .section-heading { min-height: 164px; padding: 20px 18px; }
      .section-heading > div:first-child { max-width: calc(100% - clamp(160px, 38vw, 210px) - 26px); }
      .section-body { padding-right: 0; padding-left: 0; }
      .section-heading::after {
        top: 50%;
        right: 8px;
        width: clamp(160px, 38vw, 210px);
        height: clamp(110px, 27vw, 145px);
        opacity: .76;
        transform: translateY(-50%);
      }

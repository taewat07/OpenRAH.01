<script>
(() => {
  'use strict';

  const focusableSelector = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

  function createDrawer({ drawer, trigger, scrim, closeButton = null, openClassTarget = drawer, openClass = 'open', mobileQuery = '(max-width: 760px)', focusTarget = null }) {
    if (!drawer || !trigger || !scrim) throw new Error('RAHShell drawer requires drawer, trigger, and scrim elements.');
    const media = matchMedia(mobileQuery);
    let lastFocus = null;

    const isOpen = () => openClassTarget.classList.contains(openClass);
    const sync = () => drawer.setAttribute('aria-hidden', String(media.matches && !isOpen()));
    const setOpen = (open, restoreFocus = true) => {
      const shouldOpen = Boolean(open && media.matches);
      if (shouldOpen) lastFocus = document.activeElement;
      openClassTarget.classList.toggle(openClass, shouldOpen);
      trigger.setAttribute('aria-expanded', String(shouldOpen));
      trigger.setAttribute('aria-label', shouldOpen ? 'ปิดเมนู' : 'เปิดเมนู');
      if ('hidden' in scrim) scrim.hidden = !shouldOpen;
      sync();
      if (shouldOpen) (focusTarget || drawer.querySelector(focusableSelector))?.focus();
      else if (restoreFocus && media.matches) (lastFocus || trigger)?.focus();
    };
    const onKeydown = event => {
      if (!isOpen()) return;
      if (event.key === 'Escape') { event.preventDefault(); setOpen(false); return; }
      if (event.key !== 'Tab') return;
      const nodes = [...drawer.querySelectorAll(focusableSelector)].filter(node => !node.hidden && node.getClientRects().length);
      if (!nodes.length) return;
      const first = nodes[0], last = nodes.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    };

    trigger.addEventListener('click', () => setOpen(!isOpen()));
    scrim.addEventListener('click', () => setOpen(false));
    closeButton?.addEventListener('click', () => setOpen(false));
    document.addEventListener('keydown', onKeydown);
    media.addEventListener('change', () => setOpen(false, false));
    sync();

    return Object.freeze({ open: () => setOpen(true), close: restore => setOpen(false, restore), sync, isOpen });
  }

  function bindPopovers(items, wrapperSelector = '.popover-wrap') {
    const close = () => items.forEach(({ button, panel }) => { panel.hidden = true; button.setAttribute('aria-expanded', 'false'); });
    items.forEach(({ button, panel }) => button.addEventListener('click', event => {
      event.stopPropagation();
      const willOpen = panel.hidden;
      close();
      panel.hidden = !willOpen;
      button.setAttribute('aria-expanded', String(willOpen));
    }));
    document.addEventListener('click', event => { if (!event.target.closest(wrapperSelector)) close(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
    return Object.freeze({ close });
  }

  window.RAHShell = Object.freeze({ createDrawer, bindPopovers });
})();


(function () {
  'use strict';

  const SETTINGS_METHOD = 'getRah01FormConfig';
  const SUBMIT_METHOD = 'submitRah01Assessment';
  let cachedConfig = null;

  function hasAppsScriptBridge() {
    return Boolean(window.google?.script?.run);
  }

  function callAppsScript(method, ...args) {
    return new Promise((resolve, reject) => {
      window.google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error?.message || String(error))))
        [method](...args);
    });
  }

  function normalizeDepartment(source) {
    const department = {
      id: String(source?.id ?? source?.departmentId ?? source?.department_id ?? '').trim(),
      code: String(source?.code ?? '').trim(),
      nameTh: String(source?.nameTh ?? source?.name_th ?? source?.th ?? '').trim(),
      nameEn: String(source?.nameEn ?? source?.name_en ?? source?.en ?? '').trim(),
      active: source?.active !== false && String(source?.active).toUpperCase() !== 'FALSE',
      sortOrder: Number(source?.sortOrder ?? source?.sort_order ?? 0)
    };
    if (!department.id || !department.nameTh) return null;
    return Object.freeze(department);
  }

  function normalizeConfig(source) {
    const hospitalName = String(source?.hospitalName ?? source?.hospital_name ?? '').trim();
    if (!hospitalName) throw new Error('Hospital name is missing from Settings.');
    if (hospitalName.length > 200) throw new Error('Hospital name in Settings is too long.');
    const departments = (source?.departments || [])
      .map(normalizeDepartment)
      .filter(department => department?.active)
      .sort((left, right) => left.sortOrder - right.sortOrder || left.nameTh.localeCompare(right.nameTh, 'th'));
    const ids = new Set();
    departments.forEach(department => {
      if (ids.has(department.id)) throw new Error(`Duplicate department ID: ${department.id}`);
      ids.add(department.id);
    });
    return Object.freeze({
      schemaVersion: String(source?.schemaVersion || 'rah01-form-config.v1'),
      hospitalName,
      departments: Object.freeze(departments)
    });
  }

  function previewConfig() {
    if (!window.RAH_SETTINGS_DATA) throw new Error('Preview Settings department catalog is unavailable.');
    return window.RAH_SETTINGS_DATA;
  }

  async function loadFormConfig({ force = false } = {}) {
    if (cachedConfig && !force) return cachedConfig;
    const source = hasAppsScriptBridge()
      ? await callAppsScript(SETTINGS_METHOD)
      : previewConfig();
    cachedConfig = normalizeConfig(source);
    return cachedConfig;
  }

  function getDepartment(departmentId) {
    return cachedConfig?.departments.find(department => department.id === departmentId) || null;
  }

  async function submitAssessment(payload, requestId, attachmentTransports) {
    if (!hasAppsScriptBridge()) throw new Error('Apps Script submission is unavailable in preview mode.');
    const department = getDepartment(payload?.header?.departmentId);
    if (!department) throw new Error('Selected department is not active in Settings.');
    return callAppsScript(SUBMIT_METHOD, payload, requestId, attachmentTransports);
  }

  window.RAHDepartmentService = Object.freeze({
    contract: Object.freeze({ settingsMethod: SETTINGS_METHOD, submitMethod: SUBMIT_METHOD }),
    loadFormConfig,
    getDepartment,
    submitAssessment
  });
})();

    const state = {
      checklist: {},
      hazards: {},
      customHazards: {},
      steps: [{ work: '', hazards: '', duration: '', staff: '' }]
    };

    const checklistEl = document.getElementById('checklist');
    const stepListEl = document.getElementById('stepList');
    const categoryListEl = document.getElementById('categoryList');
    const summaryBodyEl = document.getElementById('summaryBody');
    const toastEl = document.getElementById('toast');
    const departmentEl = document.getElementById('department');
    const departmentStatusEl = document.getElementById('departmentStatus');
    const hospitalTitleEl = document.getElementById('hospitalTitle');
    const hazardAttachmentAccept = 'image/*';
    let restoredDepartmentId = '';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('visible');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toastEl.classList.remove('visible'), 2600);
    }

    function formatFileSize(sizeBytes) {
      const bytes = Number(sizeBytes) || 0;
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(bytes < 10240 ? 1 : 0)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    const maxAttachmentBytes = 5 * 1024 * 1024;
    const maxTotalAttachmentBytes = 15 * 1024 * 1024;

    function fileMetadata(file) {
      return {
        name: String(file.name || 'evidence-file').replace(/[\\/\u0000-\u001f]/g, '_').slice(0, 255),
        mimeType: String(file.type || 'application/octet-stream').slice(0, 150),
        sizeBytes: Number(file.size) || 0,
        lastModified: Number(file.lastModified) || Date.now()
      };
    }

    function readFileBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('ไม่สามารถอ่านรูปหลักฐานได้'));
        reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
        reader.readAsDataURL(file);
      });
    }

    function attachmentMarkup(data, hazardLabel) {
      const attachment = data.attachment || null;
      return `<div class="hazard-evidence">
        <div class="attachment-row">
          <span class="attachment-label">รูปหลักฐาน <small>ไม่บังคับ</small></span>
          <label class="attachment-picker">
            <input class="hazard-attachment" type="file" accept="${hazardAttachmentAccept}" aria-label="แนบรูปหลักฐานสำหรับ ${escapeHtml(hazardLabel)}">
            <span class="attachment-action">${attachment ? 'เปลี่ยนรูป' : 'แนบรูป'}</span>
          </label>
          <span class="attachment-selected" data-selected="${attachment ? 'true' : 'false'}" ${attachment ? '' : 'hidden'} aria-live="polite">
            <strong class="attachment-file-name">${escapeHtml(attachment?.name || '')}</strong>
            <small class="attachment-file-meta">${attachment ? escapeHtml(formatFileSize(attachment.sizeBytes)) : ''}</small>
          </span>
          <button class="attachment-remove" type="button" ${attachment ? '' : 'hidden'} aria-label="ลบรูปหลักฐาน">ลบ</button>
        </div>
      </div>`;
    }

    function refreshAttachmentControl(row, attachment) {
      const selected = row.querySelector('.attachment-selected');
      selected.dataset.selected = String(Boolean(attachment));
      selected.hidden = !attachment;
      selected.querySelector('.attachment-file-name').textContent = attachment?.name || '';
      selected.querySelector('.attachment-file-meta').textContent = attachment ? formatFileSize(attachment.sizeBytes) : '';
      row.querySelector('.attachment-action').textContent = attachment ? 'เปลี่ยนรูป' : 'แนบรูป';
      row.querySelector('.attachment-remove').hidden = !attachment;
    }

    function renderChecklist() {
      checklistEl.innerHTML = checklistItems.map((item, index) => {
        const saved = state.checklist[item.key] || {};
        const values = item.na ? [['YES', 'มี', 'yes'], ['NO', 'ไม่มี', 'no'], ['NOT_APPLICABLE', 'ไม่เกี่ยวข้อง', 'na']] : [['YES', 'มี', 'yes'], ['NO', 'ไม่มี', 'no']];
        return `<div class="check-row" data-check-key="${item.key}">
          <div class="check-copy"><strong>${index + 1}. ${item.th}</strong><small>${item.en}</small></div>
          <div class="segmented" role="group" aria-label="${item.th}">
            ${values.map(([value, label, className]) => `<button type="button" class="segment ${saved.status === value ? `selected ${className}` : ''}" data-value="${value}">${label}</button>`).join('')}
          </div>
          ${item.na ? `<div class="na-reason ${saved.status === 'NOT_APPLICABLE' ? 'visible' : ''}"><input value="${escapeHtml(saved.reason || '')}" placeholder="ระบุเหตุผลที่ไม่เกี่ยวข้อง"></div>` : ''}
        </div>`;
      }).join('');

      checklistEl.querySelectorAll('.check-row').forEach(row => {
        const key = row.dataset.checkKey;
        row.querySelectorAll('.segment').forEach(button => button.addEventListener('click', () => {
          state.checklist[key] = state.checklist[key] || {};
          state.checklist[key].status = button.dataset.value;
          row.querySelectorAll('.segment').forEach(item => item.className = 'segment');
          const className = button.dataset.value === 'YES' ? 'yes' : button.dataset.value === 'NO' ? 'no' : 'na';
          button.classList.add('selected', className);
          const reason = row.querySelector('.na-reason');
          if (reason) reason.classList.toggle('visible', button.dataset.value === 'NOT_APPLICABLE');
          updateProgress();
        }));
        const reasonInput = row.querySelector('.na-reason input');
        if (reasonInput) reasonInput.addEventListener('input', () => {
          state.checklist[key] = state.checklist[key] || {};
          state.checklist[key].reason = reasonInput.value;
        });
      });
      updateProgress();
    }

    function renderSteps() {
      stepListEl.innerHTML = state.steps.map((step, index) => `<div class="step-card" data-step-index="${index}">
        <div class="step-number">${String(index + 1).padStart(2, '0')}</div>
        <div class="step-main-fields">
          <div class="mini-field step-work"><label>ขั้นตอนการทำงาน</label><textarea data-field="work" required>${escapeHtml(step.work)}</textarea></div>
          <div class="mini-field step-hazards"><label>สิ่งคุกคามหลัก</label><textarea data-field="hazards" required>${escapeHtml(step.hazards)}</textarea></div>
        </div>
        <div class="step-meta-fields">
          <div class="mini-field duration"><label>ระยะเวลา</label><input data-field="duration" value="${escapeHtml(step.duration)}" required></div>
          <div class="mini-field staff"><label>จำนวนคน</label><input data-field="staff" type="number" min="1" value="${escapeHtml(step.staff)}" required></div>
        </div>
        <button class="icon-button remove" type="button" aria-label="ลบขั้นตอน" title="ลบขั้นตอน">×</button>
      </div>`).join('');

      stepListEl.querySelectorAll('.step-card').forEach(card => {
        const index = Number(card.dataset.stepIndex);
        card.querySelectorAll('[data-field]').forEach(input => input.addEventListener('input', () => {
          state.steps[index][input.dataset.field] = input.type === 'number' ? Number(input.value) : input.value;
          updateProgress();
        }));
        card.querySelector('.remove').addEventListener('click', () => {
          if (state.steps.length === 1) return showToast('ต้องมีขั้นตอนการทำงานอย่างน้อย 1 รายการ');
          state.steps.splice(index, 1);
          renderSteps();
          updateProgress();
        });
      });
      document.getElementById('stepCount').textContent = `${state.steps.length} ขั้นตอน`;
    }

    function scoreFor(data) {
      if (!data || !data.hasRisk || !data.a || !data.b) return null;
      const score = Number(data.a) * Number(data.b);
      return { score, level: score <= 2 ? 'low' : score <= 4 ? 'medium' : 'high', label: score <= 2 ? 'ต่ำ' : score <= 4 ? 'ปานกลาง' : 'สูง' };
    }

    function hazardRowMarkup(category, hazard, customId = null) {
      const [key, th, en] = hazard;
      const stateKey = customId || key;
      const data = customId ? state.customHazards[stateKey] || {} : state.hazards[stateKey] || {};
      const result = scoreFor(data);
      const titleBlock = customId
        ? `<div class="custom-title"><input class="custom-hazard-input" value="${escapeHtml(data.title || '')}" placeholder="ระบุชื่อสิ่งคุกคามอื่นในหมวดนี้"></div>`
        : '';
      return `<div class="hazard-row" data-category="${category.code}" data-hazard-key="${stateKey}" data-custom="${customId ? 'true' : 'false'}">
        ${titleBlock}
        <div class="hazard-head">
          <div class="hazard-name"><strong>${customId ? 'สิ่งคุกคามอื่น' : th}</strong><small>${customId ? 'Other hazard' : en}</small></div>
          <div class="risk-switch">
            <button type="button" class="risk-choice present ${data.hasRisk === true ? 'selected' : ''}" data-risk="true">มีความเสี่ยง</button>
            <button type="button" class="risk-choice absent ${data.hasRisk === false ? 'selected' : ''}" data-risk="false">ไม่มีความเสี่ยง</button>
            ${customId ? '<button type="button" class="icon-button remove-custom" aria-label="ลบสิ่งคุกคาม">×</button>' : ''}
          </div>
        </div>
        <div class="risk-fields ${data.hasRisk === true ? 'visible' : ''}">
          <div class="mini-field field-staff"><label>บุคลากร (คน)</label><input class="hazard-staff" type="number" min="0" value="${escapeHtml(data.staff ?? '')}"></div>
          <div class="mini-field field-clients"><label>ผู้รับบริการ (คน)</label><input class="hazard-clients" type="number" min="0" value="${escapeHtml(data.clients ?? '')}"></div>
          <div class="mini-field field-exposure"><label>โอกาสรับสัมผัส A</label><div class="score-toggle" role="group" aria-label="โอกาสรับสัมผัส A">${[[1, 'น้อย'], [2, 'ปานกลาง'], [3, 'มาก']].map(([value, label]) => `<button type="button" class="score-option ${Number(data.a) === value ? 'selected' : ''}" data-score="a" data-value="${value}" aria-pressed="${Number(data.a) === value}"><strong>${value}</strong><span>${label}</span></button>`).join('')}</div></div>
          <div class="mini-field field-severity"><label>ความรุนแรง B</label><div class="score-toggle" role="group" aria-label="ความรุนแรง B">${[[1, 'เล็กน้อย'], [2, 'ปานกลาง'], [3, 'ร้ายแรง']].map(([value, label]) => `<button type="button" class="score-option ${Number(data.b) === value ? 'selected' : ''}" data-score="b" data-value="${value}" aria-pressed="${Number(data.b) === value}"><strong>${value}</strong><span>${label}</span></button>`).join('')}</div></div>
          <div class="mini-field field-controls"><label>วิธีควบคุมที่มีอยู่ <span class="required">*</span></label><textarea class="hazard-controls" placeholder="หากไม่มี ให้ระบุว่า ไม่มี">${escapeHtml(data.controls || '')}</textarea></div>
          <div class="mini-field field-score"><label>ระดับความเสี่ยง C = A × B</label><div class="score-display ${result ? result.level : 'empty'}" aria-live="polite"><strong class="score-number">${result ? result.score : '—'}</strong><span class="risk-badge ${result ? result.level : 'empty'}">${result ? result.label : 'รอคะแนน'}</span></div>${attachmentMarkup(data, customId ? data.title || 'สิ่งคุกคามอื่น' : th)}</div>
          <div class="mini-field field-recommendation recommendation ${result && result.score >= 3 ? 'visible' : ''}"><label>ข้อเสนอแนะของผู้ประเมิน <span class="required">*</span></label><textarea class="hazard-recommendation" placeholder="ระบุสิ่งที่ควรปรับปรุง">${escapeHtml(data.recommendation || '')}</textarea></div>
        </div>
      </div>`;
    }

    function renderCategories() {
      const hasExistingCategories = categoryListEl.children.length > 0;
      const openCategoryCodes = new Set(
        Array.from(categoryListEl.querySelectorAll('.category[open]'), element => element.dataset.categoryCode)
      );
      categoryListEl.innerHTML = categories.map((category, index) => {
        const customs = Object.entries(state.customHazards).filter(([, value]) => value.category === category.code);
        const answered = category.hazards.filter(([key]) => typeof state.hazards[key]?.hasRisk === 'boolean').length;
        const present = category.hazards.filter(([key]) => state.hazards[key]?.hasRisk === true).length + customs.filter(([, value]) => value.hasRisk).length;
        const isOpen = hasExistingCategories ? openCategoryCodes.has(category.code) : index === 0;
        return `<details class="category" data-category-code="${category.code}" ${isOpen ? 'open' : ''}>
          <summary>
            <span class="category-number">${String(index + 1).padStart(2, '0')}</span>
            <img class="category-icon" src="${category.icon}" alt="" aria-hidden="true" loading="lazy" decoding="async">
            <span class="category-title"><strong>${category.th}</strong><small>${category.en}</small></span>
            <span class="category-status ${present > 0 ? 'has-risk' : answered === category.hazards.length ? 'complete' : ''}">${answered} / ${category.hazards.length} · พบ ${present}</span>
            <span class="category-chevron">⌄</span>
          </summary>
          <div class="category-tools">
            <button class="button ghost small mark-none" type="button">ไม่พบความเสี่ยงทั้งหมวด</button>
            <button class="button small add-custom" type="button">＋ เพิ่มสิ่งคุกคามอื่น</button>
          </div>
          <div class="hazard-list">
            ${category.hazards.map(hazard => hazardRowMarkup(category, hazard)).join('')}
            ${customs.map(([id]) => hazardRowMarkup(category, ['OTHER', 'อื่นๆ', 'Other'], id)).join('')}
          </div>
        </details>`;
      }).join('');

      categoryListEl.querySelectorAll('.category').forEach(categoryEl => {
        const categoryCode = categoryEl.dataset.categoryCode;
        categoryEl.querySelector('.mark-none').addEventListener('click', () => {
          const category = categories.find(item => item.code === categoryCode);
          category.hazards.forEach(([key]) => state.hazards[key] = { hasRisk: false });
          renderCategories();
          updateAll();
          showToast(`บันทึกว่าไม่พบความเสี่ยงในหมวด ${category.th}`);
        });
        categoryEl.querySelector('.add-custom').addEventListener('click', () => {
          const id = `OTHER-${categoryCode}-${Date.now()}`;
          state.customHazards[id] = { category: categoryCode, title: '', hasRisk: true };
          renderCategories();
          categoryListEl.querySelector(`[data-hazard-key="${id}"] .custom-hazard-input`)?.focus();
          updateAll();
        });
      });

      bindHazardRows();
      updateAll();
    }

    function bindHazardRows() {
      categoryListEl.querySelectorAll('.hazard-row').forEach(row => {
        const key = row.dataset.hazardKey;
        const isCustom = row.dataset.custom === 'true';
        const store = isCustom ? state.customHazards : state.hazards;
        store[key] = store[key] || {};
        const data = store[key];

        row.querySelectorAll('.risk-choice').forEach(button => button.addEventListener('click', () => {
          data.hasRisk = button.dataset.risk === 'true';
          if (!data.hasRisk) Object.keys(data).filter(prop => !['hasRisk', 'category', 'title'].includes(prop)).forEach(prop => delete data[prop]);
          row.querySelectorAll('.risk-choice').forEach(choice => choice.classList.remove('selected'));
          button.classList.add('selected');
          row.querySelector('.risk-fields').classList.toggle('visible', data.hasRisk);
          if (!data.hasRisk) {
            row.querySelector('.hazard-attachment').value = '';
            refreshAttachmentControl(row, null);
          }
          refreshHazardRow(row, data);
          updateAll();
        }));

        const bindings = [
          ['.hazard-staff', 'staff', true], ['.hazard-clients', 'clients', true],
          ['.hazard-controls', 'controls', false], ['.hazard-recommendation', 'recommendation', false], ['.custom-hazard-input', 'title', false]
        ];
        bindings.forEach(([selector, property, numeric]) => {
          const input = row.querySelector(selector);
          if (!input) return;
          input.addEventListener('input', () => {
            data[property] = numeric && input.value !== '' ? Number(input.value) : input.value;
            refreshHazardRow(row, data);
            updateAll();
          });
        });

        const attachmentInput = row.querySelector('.hazard-attachment');
        attachmentInput.addEventListener('change', async () => {
          const file = attachmentInput.files?.[0];
          if (!file) return;
          if (!String(file.type || '').startsWith('image/')) {
            attachmentInput.value = '';
            showToast('กรุณาเลือกไฟล์รูปภาพเท่านั้น');
            return;
          }
          if (file.size > maxAttachmentBytes) {
            attachmentInput.value = '';
            showToast('รูปหลักฐานต้องมีขนาดไม่เกิน 5 MB');
            return;
          }
          attachmentInput.disabled = true;
          try {
            data.attachment = { ...fileMetadata(file), dataBase64: await readFileBase64(file) };
            refreshAttachmentControl(row, data.attachment);
            updateAll();
          } catch (error) {
            delete data.attachment;
            attachmentInput.value = '';
            showToast(error.message || 'ไม่สามารถอ่านรูปหลักฐานได้');
          } finally {
            attachmentInput.disabled = false;
          }
        });
        row.querySelector('.attachment-remove').addEventListener('click', () => {
          delete data.attachment;
          attachmentInput.value = '';
          refreshAttachmentControl(row, null);
          updateAll();
        });

        row.querySelectorAll('.score-option').forEach(button => button.addEventListener('click', () => {
          const property = button.dataset.score;
          data[property] = Number(button.dataset.value);
          row.querySelectorAll(`.score-option[data-score="${property}"]`).forEach(option => {
            const selected = option === button;
            option.classList.toggle('selected', selected);
            option.setAttribute('aria-pressed', String(selected));
          });
          refreshHazardRow(row, data);
          updateAll();
        }));

        row.querySelector('.remove-custom')?.addEventListener('click', () => {
          delete state.customHazards[key];
          renderCategories();
        });
      });
    }

    function refreshHazardRow(row, data) {
      const result = scoreFor(data);
      row.querySelector('.score-number').textContent = result ? result.score : '—';
      row.querySelector('.score-display').className = `score-display ${result ? result.level : 'empty'}`;
      const badge = row.querySelector('.risk-badge');
      badge.className = `risk-badge ${result ? result.level : 'empty'}`;
      badge.textContent = result ? result.label : 'รอคะแนน';
      row.querySelector('.recommendation').classList.toggle('visible', Boolean(result && result.score >= 3));
    }

    function getRiskRows() {
      const rows = [];
      categories.forEach(category => category.hazards.forEach(([key, th, en]) => {
        const data = state.hazards[key];
        const result = scoreFor(data);
        if (data?.hasRisk) rows.push({ category, key, th, en, data, result });
      }));
      Object.entries(state.customHazards).forEach(([key, data]) => {
        if (!data.hasRisk) return;
        const category = categories.find(item => item.code === data.category);
        rows.push({ category, key, th: data.title || 'สิ่งคุกคามอื่น', en: 'Other hazard', data, result: scoreFor(data) });
      });
      return rows.sort((left, right) => (right.result?.score || 0) - (left.result?.score || 0));
    }

    function renderSummary() {
      const rows = getRiskRows();
      document.getElementById('summaryCount').textContent = `${rows.length} ความเสี่ยง`;
      if (!rows.length) {
        summaryBodyEl.innerHTML = '<div class="summary-empty"><strong>ยังไม่มีรายการความเสี่ยง</strong>เลือกว่า “มีความเสี่ยง” ในหมวดสิ่งคุกคาม แล้วผลสรุปจะปรากฏที่นี่</div>';
        return;
      }
      summaryBodyEl.innerHTML = `<div class="summary-table-wrap"><table class="summary-table">
        <thead><tr><th>สิ่งคุกคาม</th><th>A</th><th>B</th><th>C</th><th>ระดับ</th><th>ผู้สัมผัส</th><th>วิธีควบคุม / ข้อเสนอแนะ</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
          <td><strong>${escapeHtml(row.th)}</strong><br><span>${escapeHtml(row.category.th)}</span></td>
          <td>${row.data.a || '—'}</td><td>${row.data.b || '—'}</td><td><strong>${row.result?.score || '—'}</strong></td>
          <td><span class="risk-badge ${row.result?.level || 'empty'}">${row.result?.label || 'ไม่ครบ'}</span></td>
          <td>บุคลากร ${row.data.staff ?? '—'}<br>ผู้รับบริการ ${row.data.clients ?? '—'}</td>
          <td>${escapeHtml(row.data.controls || 'ยังไม่ระบุ')}${row.data.recommendation ? `<br><strong>แนะนำ:</strong> ${escapeHtml(row.data.recommendation)}` : ''}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    }

    function updateProgress() {
      const headerComplete = Number(Boolean(document.getElementById('assessmentDate').value)) + Number(Boolean(departmentEl.value)) + Number(Number(document.getElementById('staffTotal').value) > 0);
      const checklistComplete = checklistItems.filter(item => Boolean(state.checklist[item.key]?.status)).length;
      const validSteps = state.steps.filter(step => step.work && step.hazards && step.duration && Number(step.staff) > 0).length;
      const hazardTotal = categories.reduce((sum, category) => sum + category.hazards.length, 0);
      const hazardsComplete = categories.reduce((sum, category) => sum + category.hazards.filter(([key]) => typeof state.hazards[key]?.hasRisk === 'boolean').length, 0);
      const completed = headerComplete + checklistComplete + validSteps + hazardsComplete;
      const total = 3 + checklistItems.length + state.steps.length + hazardTotal;
      const progress = Math.round((completed / total) * 100);
      document.getElementById('progressValue').textContent = `${progress}%`;
      const footerProgress = document.getElementById('footerProgress');
      const progressCells = [...footerProgress.querySelectorAll('.progress-segment')];
      const chargedCells = Math.round((progress / 100) * progressCells.length);
      footerProgress.setAttribute('aria-valuenow', String(progress));
      progressCells.forEach((cell, index) => cell.classList.toggle('active', index < chargedCells));
      document.getElementById('checklistCount').textContent = `${checklistComplete} / ${checklistItems.length} รายการ`;
      document.getElementById('hazardCount').textContent = `${hazardsComplete} / ${hazardTotal} รายการ`;
    }

    function updateAll() {
      updateProgress();
      renderSummary();
      categoryListEl.querySelectorAll('.category').forEach(categoryEl => {
        const category = categories.find(item => item.code === categoryEl.dataset.categoryCode);
        const answered = category.hazards.filter(([key]) => typeof state.hazards[key]?.hasRisk === 'boolean').length;
        const present = category.hazards.filter(([key]) => state.hazards[key]?.hasRisk === true).length + Object.values(state.customHazards).filter(item => item.category === category.code && item.hasRisk).length;
        const status = categoryEl.querySelector('.category-status');
        status.textContent = `${answered} / ${category.hazards.length} · พบ ${present}`;
        status.classList.toggle('complete', present === 0 && answered === category.hazards.length);
        status.classList.toggle('has-risk', present > 0);
      });
    }

    function saveDraft() {
      const draft = {
        state,
        header: {
          departmentId: departmentEl.value,
          evaluatorName: document.getElementById('evaluator').value,
          staffTotal: document.getElementById('staffTotal').value,
          additionalEvaluators: document.getElementById('additionalEvaluators').value
        },
        savedAt: new Date().toISOString()
      };
      sessionStorage.setItem('rah01:preview:draft:1.1.0', JSON.stringify(draft));
      const time = new Intl.DateTimeFormat('th-TH', { hour: '2-digit', minute: '2-digit' }).format(new Date());
      document.getElementById('saveStateText').textContent = `บันทึกล่าสุด ${time} น.`;
      showToast('บันทึกแบบร่างในเซสชันนี้แล้ว');
    }

    function restoreDraft() {
      const rawDraft = sessionStorage.getItem('rah01:preview:draft:1.1.0');
      if (!rawDraft) return;
      try {
        const draft = JSON.parse(rawDraft);
        if (!draft.state || !Array.isArray(draft.state.steps)) throw new Error('Invalid draft');
        state.checklist = draft.state.checklist || {};
        state.hazards = draft.state.hazards || {};
        state.customHazards = draft.state.customHazards || {};
        state.steps = draft.state.steps;
        restoredDepartmentId = String(draft.header?.departmentId || '');
        document.getElementById('evaluator').value = draft.header?.evaluatorName || document.getElementById('evaluator').value;
        document.getElementById('staffTotal').value = draft.header?.staffTotal || document.getElementById('staffTotal').value;
        document.getElementById('additionalEvaluators').value = draft.header?.additionalEvaluators || '';
        const savedTime = draft.savedAt ? new Date(draft.savedAt) : null;
        document.getElementById('saveStateText').textContent = savedTime && !Number.isNaN(savedTime.getTime())
          ? `เรียกคืนแบบร่างที่บันทึก ${new Intl.DateTimeFormat('th-TH', { hour: '2-digit', minute: '2-digit' }).format(savedTime)} น.`
          : 'เรียกคืนแบบร่างจากเซสชันนี้แล้ว';
      } catch (error) {
        sessionStorage.removeItem('rah01:preview:draft:1.1.0');
      }
    }

    function setSmartAssessmentDate() {
      const input = document.getElementById('assessmentDate');
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      input.value = `${year}-${month}-${day}`;
    }

    function focusValidationTarget(target) {
      if (!target) return;
      document.querySelectorAll('.validation-focus').forEach(element => element.classList.remove('validation-focus'));
      const category = target.closest('details.category');
      if (category) category.open = true;
      target.classList.add('validation-focus');
      target.focus({ preventScroll: true });
      const previousScrollBehavior = document.documentElement.style.scrollBehavior;
      document.documentElement.style.scrollBehavior = 'auto';
      target.scrollIntoView({ block: 'center', inline: 'nearest' });
      document.documentElement.style.scrollBehavior = previousScrollBehavior;
      const clearHighlight = () => target.classList.remove('validation-focus');
      target.addEventListener('input', clearHighlight, { once: true });
      target.addEventListener('click', clearHighlight, { once: true });
    }

    function rejectReview(target, message) {
      focusValidationTarget(target);
      showToast(message);
      return false;
    }

    function validateForReview() {
      const assessmentDate = document.getElementById('assessmentDate');
      const staffTotal = document.getElementById('staffTotal');
      if (!assessmentDate.value) return rejectReview(assessmentDate, 'กรุณาระบุวันที่ทำการประเมิน');
      if (!departmentEl.value || !window.RAHDepartmentService.getDepartment(departmentEl.value)) return rejectReview(departmentEl, 'กรุณาเลือกแผนกจากรายการที่ผู้ดูแลกำหนด');
      if (!(Number(staffTotal.value) > 0)) return rejectReview(staffTotal, 'กรุณาระบุจำนวนผู้ปฏิบัติงานทั้งหมด');

      const firstMissingChecklist = checklistItems.find(item => !state.checklist[item.key]?.status);
      if (firstMissingChecklist) {
        const missingCount = checklistItems.filter(item => !state.checklist[item.key]?.status).length;
        const target = document.querySelector(`[data-check-key="${firstMissingChecklist.key}"] .segment`);
        return rejectReview(target, `ยังตอบระบบอาชีวอนามัยไม่ครบ ${missingCount} รายการ`);
      }

      const invalidStepIndex = state.steps.findIndex(step => !step.work || !step.hazards || !step.duration || !(Number(step.staff) > 0));
      if (invalidStepIndex >= 0) {
        const step = state.steps[invalidStepIndex];
        const field = !step.work ? 'work' : !step.hazards ? 'hazards' : !step.duration ? 'duration' : 'staff';
        const target = stepListEl.querySelector(`[data-step-index="${invalidStepIndex}"] [data-field="${field}"]`);
        return rejectReview(target, `กรุณากรอกข้อมูลขั้นตอนการทำงานที่ ${invalidStepIndex + 1} ให้ครบ`);
      }

      const firstUnansweredHazard = categories.flatMap(category => category.hazards).find(([key]) => typeof state.hazards[key]?.hasRisk !== 'boolean');
      if (firstUnansweredHazard) {
        const unansweredCount = categories.reduce((count, category) => count + category.hazards.filter(([key]) => typeof state.hazards[key]?.hasRisk !== 'boolean').length, 0);
        const row = document.querySelector(`[data-hazard-key="${firstUnansweredHazard[0]}"]`);
        return rejectReview(row?.querySelector('.risk-choice.present'), `ยังประเมินสิ่งคุกคามไม่ครบ ${unansweredCount} รายการ`);
      }

      const invalidRisk = getRiskRows().find(row => !row.data.a || !row.data.b || row.data.staff === undefined || row.data.clients === undefined || !String(row.data.controls || '').trim() || (row.result?.score >= 3 && !String(row.data.recommendation || '').trim()));
      if (invalidRisk) {
        const row = document.querySelector(`[data-hazard-key="${invalidRisk.key}"]`);
        let target;
        let fieldLabel;
        if (!invalidRisk.data.a) {
          target = row?.querySelector('.score-option[data-score="a"]');
          fieldLabel = 'โอกาสรับสัมผัส A';
        } else if (!invalidRisk.data.b) {
          target = row?.querySelector('.score-option[data-score="b"]');
          fieldLabel = 'ความรุนแรง B';
        } else if (invalidRisk.data.staff === undefined) {
          target = row?.querySelector('.hazard-staff');
          fieldLabel = 'จำนวนบุคลากร';
        } else if (invalidRisk.data.clients === undefined) {
          target = row?.querySelector('.hazard-clients');
          fieldLabel = 'จำนวนผู้รับบริการ';
        } else if (!String(invalidRisk.data.controls || '').trim()) {
          target = row?.querySelector('.hazard-controls');
          fieldLabel = 'วิธีควบคุมที่มีอยู่';
        } else {
          target = row?.querySelector('.hazard-recommendation');
          fieldLabel = 'ข้อเสนอแนะของผู้ประเมิน';
        }
        return rejectReview(target, `กรุณาระบุ${fieldLabel}สำหรับ ${invalidRisk.th}`);
      }

      const payload = buildSubmissionPayload();
      sessionStorage.setItem('rah01:preview:review:1.1.0', JSON.stringify(payload));
      window.dispatchEvent(new CustomEvent('rah01:ready-for-review', { detail: payload }));
      showToast('ข้อมูลครบ พร้อมเข้าสู่หน้ายืนยันการส่ง');
      return true;
    }

    function buildSubmissionPayload() {
      const department = window.RAHDepartmentService.getDepartment(departmentEl.value);
      if (!department) throw new Error('A current Settings department is required.');
      return {
        schemaVersion: 'rah01-submission.v1',
        formVersion: '1.1.0',
        header: {
          assessmentDate: document.getElementById('assessmentDate').value,
          departmentId: department.id,
          departmentSnapshot: { code: department.code, nameTh: department.nameTh, nameEn: department.nameEn },
          evaluatorName: document.getElementById('evaluator').value.trim(),
          totalStaffCount: Number(document.getElementById('staffTotal').value),
          additionalEvaluators: document.getElementById('additionalEvaluators').value.trim()
        },
        checklist: checklistItems.map(item => ({
          itemKey: item.key,
          status: state.checklist[item.key]?.status || null,
          notApplicableReason: state.checklist[item.key]?.status === 'NOT_APPLICABLE' ? String(state.checklist[item.key]?.reason || '').trim() : null
        })),
        workSteps: state.steps.map((step, index) => ({
          order: index + 1,
          workStep: String(step.work || '').trim(),
          primaryHazards: String(step.hazards || '').trim(),
          workDuration: String(step.duration || '').trim(),
          staffInvolvedCount: Number(step.staff)
        })),
        hazardEvaluations: getRiskRows().map(row => ({
          categoryCode: row.category.code,
          hazardKey: row.custom ? 'OTHER' : row.key,
          customTitle: row.custom ? String(row.data.title || '').trim() : null,
          hasRisk: true,
          exposedStaffCount: Number(row.data.staff),
          exposedClientCount: Number(row.data.clients),
          exposureScoreA: Number(row.data.a),
          severityScoreB: Number(row.data.b),
          existingControls: String(row.data.controls || '').trim(),
          recommendation: String(row.data.recommendation || '').trim(),
          evidenceAttachment: row.data.attachment ? {
            name: row.data.attachment.name,
            mimeType: row.data.attachment.mimeType,
            sizeBytes: Number(row.data.attachment.sizeBytes) || 0,
            lastModified: Number(row.data.attachment.lastModified) || 0
          } : null
        }))
      };
    }

    async function loadDepartments() {
      try {
        const config = await window.RAHDepartmentService.loadFormConfig();
        hospitalTitleEl.textContent = `RAH.01 · ${config.hospitalName}`;
        document.title = `RAH.01 — ${config.hospitalName}`;
        departmentEl.innerHTML = '<option value="">เลือกแผนก</option>' + config.departments.map(department => `<option value="${escapeHtml(department.id)}">${escapeHtml(department.nameTh)}${department.nameEn ? ` · ${escapeHtml(department.nameEn)}` : ''}</option>`).join('');
        if (restoredDepartmentId && config.departments.some(department => department.id === restoredDepartmentId)) departmentEl.value = restoredDepartmentId;
        departmentStatusEl.textContent = config.departments.length ? `พร้อมใช้งาน ${config.departments.length} แผนก` : 'ยังไม่มีแผนกที่เปิดใช้งานใน Settings';
      } catch (error) {
        departmentEl.innerHTML = '<option value="">โหลดรายการแผนกไม่สำเร็จ</option>';
        departmentStatusEl.textContent = 'ติดต่อผู้ดูแลระบบเพื่อตรวจสอบ Settings';
        showToast('โหลดรายการแผนกไม่สำเร็จ');
      }
      updateProgress();
    }

    document.getElementById('addStepButton').addEventListener('click', () => {
      state.steps.push({ work: '', hazards: '', duration: '', staff: '' });
      renderSteps();
      updateProgress();
      stepListEl.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    ['assessmentDate', 'staffTotal', 'evaluator', 'additionalEvaluators'].forEach(id => document.getElementById(id).addEventListener('input', updateProgress));
    departmentEl.addEventListener('change', updateProgress);

    const mobileDrawer = document.getElementById('mobileDrawer');
    const menuToggle = document.getElementById('menuToggle');
    const drawerClose = document.getElementById('drawerClose');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const editorDrawer = window.RAHShell.createDrawer({
      drawer: mobileDrawer,
      trigger: menuToggle,
      scrim: drawerBackdrop,
      closeButton: drawerClose,
      openClassTarget: document.body,
      openClass: 'drawer-open',
      focusTarget: drawerClose
    });
    const setDrawer = (open, restoreFocus = true) => open ? editorDrawer.open() : editorDrawer.close(restoreFocus);

    document.querySelectorAll('.nav-item').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      setDrawer(false, false);
      document.getElementById(button.dataset.target)?.scrollIntoView({ behavior: 'smooth' });
    }));
    document.getElementById('printButton').addEventListener('click', () => window.print());
    document.getElementById('saveBottomButton').addEventListener('click', saveDraft);
    document.getElementById('reviewButton').addEventListener('click', validateForReview);

    let printOpenState = [];
    window.addEventListener('beforeprint', () => {
      printOpenState = Array.from(document.querySelectorAll('details.category')).map(details => details.open);
      document.querySelectorAll('details.category').forEach(details => details.open = true);
    });
    window.addEventListener('afterprint', () => {
      document.querySelectorAll('details.category').forEach((details, index) => details.open = printOpenState[index] ?? details.open);
    });

    setSmartAssessmentDate();
    restoreDraft();
    loadDepartments();
    renderChecklist();
    renderSteps();
    renderCategories();
    let submissionInProgress = false;

    function attachmentTransportsForSubmission() {
      return getRiskRows().map(row => row.data.attachment?.dataBase64 ? { dataBase64: row.data.attachment.dataBase64 } : null);
    }

    window.addEventListener('rah01:ready-for-review', async event => {
      if (submissionInProgress) return;
      if (!window.confirm('ยืนยันส่งแบบประเมิน RAH.01 ไปยังผู้ดูแลระบบ?')) return;
      const attachments = attachmentTransportsForSubmission();
      const totalBytes = getRiskRows().reduce((sum, row) => sum + Number(row.data.attachment?.sizeBytes || 0), 0);
      if (totalBytes > maxTotalAttachmentBytes) {
        showToast('รูปหลักฐานรวมต้องมีขนาดไม่เกิน 15 MB');
        return;
      }
      const missingBytes = getRiskRows().find(row => row.data.attachment && !row.data.attachment.dataBase64);
      if (missingBytes) {
        showToast('กรุณาเลือกรูปหลักฐานใหม่ก่อนส่ง');
        return;
      }
      const requestKey = 'rah01:submission-request:1.1.0';
      const requestId = sessionStorage.getItem(requestKey) || crypto.randomUUID();
      sessionStorage.setItem(requestKey, requestId);
      submissionInProgress = true;
      const button = document.getElementById('reviewButton');
      button.disabled = true;
      showToast('กำลังส่งข้อมูล…');
      try {
        const result = await window.RAHDepartmentService.submitAssessment(event.detail, requestId, attachments);
        sessionStorage.removeItem(requestKey);
        sessionStorage.removeItem('rah01:preview:draft:1.1.0');
        sessionStorage.removeItem('rah01:preview:review:1.1.0');
        submissionInProgress = false;
        button.disabled = false;
        document.getElementById('saveStateText').textContent = `ส่งสำเร็จ · ${result.reportNumber}`;
        showToast(`ส่งสำเร็จ เลขที่รายงาน ${result.reportNumber}`);
      } catch (error) {
        button.disabled = false;
        submissionInProgress = false;
        showToast(error.message || 'ส่งข้อมูลไม่สำเร็จ');
      }
    });

    window.__rah01Form = Object.freeze({ buildSubmissionPayload, validateForReview });
</script>
